[package]
name = "howami"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "One-click cross-platform computer hardware and system report generator"
repository = "https://github.com/Silverbell-Choir/HowAmI"
publish = false

[[bin]]
name = "HowAmI"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
